name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Configure app icon and name
        run: |
          # 把图标复制到安卓资源目录
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp www/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp www/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp www/icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/td-game.apk
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: td-game-apk
          path: output/td-game.apk
          retention-days: 90
