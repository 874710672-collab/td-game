name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show Android SDK env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -d "$ANDROID_HOME" 2>/dev/null || echo "no ANDROID_HOME"
          ls /usr/local/lib/android/sdk 2>/dev/null | head || true

      - run: npm install

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy icons
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp www/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp www/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp www/icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: td-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
